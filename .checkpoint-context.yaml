schema_version: "1"
timestamp: "2026-03-15T12:32:05-07:00"
context:
    problem_statement: 'Checkpoint mixed two concerns in one binary: capturing development history and managing LLM knowledge/guardrails. The schema was overengineered with 20+ unused struct types. Documentation was duplicated across 3 locations. No way to import existing git history.'
    key_insights:
        - insight: Separating history capture from knowledge management makes each tool's purpose clear and lets them evolve independently
          impact: Users understand which tool to use for what. Commands are discoverable by purpose rather than memorizing a flat list of 23.
          scope: project
        - insight: Most of the project schema (ProjectDocument with 15+ types) was write-only dead code never read back at runtime
          impact: Schema should match what's actually used, not what might theoretically be useful
          scope: project
        - insight: Import is just the check/commit workflow in reverse — same template, same schema, same gating
          impact: New features should reuse existing patterns rather than inventing parallel mechanisms
          scope: project
    decisions_made:
        - decision: Two fully independent binaries, no cross-dependency
          rationale: Each binary must stand alone. If guardrail isn't installed, checkpoint still works. Shared code lives in internal/ packages, not in binary-to-binary calls.
          alternatives_considered:
            - 'Single binary with subcommand groups (rejected: muddies the mental model)'
            - 'Shared library with thin CLI wrappers (rejected: unnecessary complexity for 2 binaries)'
          scope: project
        - decision: Consolidate two project files into one at .checkpoint/project.yaml
          rationale: Root-level .checkpoint-project.yaml was confusing alongside .checkpoint/project.yaml. One file with append-only recommendations queue is simpler.
          alternatives_considered:
            - 'Keep both files with different roles (rejected: users couldn''t tell which to edit)'
          scope: project
        - decision: Drop established_patterns from context schema, capture as decisions
          rationale: Patterns and decisions were being duplicated. A decision with scope:project serves both purposes.
          alternatives_considered:
            - 'Keep patterns as separate field (rejected: LLMs restated decisions as patterns)'
          scope: project
        - decision: Import uses same input template as check, not a separate schema
          rationale: LLM already knows how to fill checkpoint inputs. Reuse that knowledge for historical enrichment.
          alternatives_considered:
            - 'Custom import schema (rejected: unnecessary divergence)'
            - 'Batch import with single LLM call for all commits (rejected: too much context, worse results)'
          scope: checkpoint
    key_exchanges:
        - prompt_summary: Human asked to read entire codebase and evaluate against vision of structured LLM development context
          approach_taken: Thorough review identifying 23 commands, 14.7k lines, strong core workflow but scope creep in skills/prompts/project schema
          human_feedback: Agreed on focus but pushed back on cutting features — they have value, the issue is packaging not purpose. Proposed splitting into checkpoint and guardrail.
        - prompt_summary: 'Human directed binary split with constraint: each must stand alone, no cross-dependency'
          approach_taken: Planned and executed split into internal/app/checkpoint/ and internal/app/guardrail/ with shared internal/ packages
          human_feedback: Approved. Insisted on separate init, doctor, and start for each binary.
        - prompt_summary: Human asked to simplify schema and add prompt/response capture
          approach_taken: Consolidated project files, gutted 442 lines of dead types, added key_exchanges with 3 fields, trimmed context template
          human_feedback: Approved all changes. Emphasized low burden on dev — LLM fills key_exchanges, human just reviews.
        - prompt_summary: Human asked for import command to bootstrap from existing git history
          approach_taken: Built checkpoint import with mechanical (--no-enrich) and interactive modes, reusing existing input template pattern
          human_feedback: Approved approach of iterative per-commit enrichment rather than batch processing.
