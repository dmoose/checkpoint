context:
    problem_statement: Session was originally designed only for emergency handoff when closing an LLM session. It needed to become a living planning document similar to Claude's plan mode - enabling explicit planning before execution and continuous tracking during work.
    key_insights:
        - insight: 'Session and next_steps serve different purposes: ephemeral planning vs historical record'
          impact: Keep both - session for active planning, next_steps in checkpoint for permanent history
          scope: project
        - insight: Plan mode (explicit planning phase) improves complex task execution
          impact: LLMs work better when they plan before coding; session enables this workflow
          scope: project
    decisions_made:
        - decision: Session is ephemeral - cleared on commit by default
          rationale: Completed work unit should start fresh. Historical record lives in changelog next_steps.
          alternatives_considered:
            - Keep session always - rejected, causes stale planning state
            - Auto-archive sessions - rejected, adds complexity without clear value
          scope: project
        - decision: Handoff replaces rather than appends
